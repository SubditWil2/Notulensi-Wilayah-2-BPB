        // ── 1. LOAD FILE DARI ONEDRIVE ──
        async function loadDokumenDariOneDrive() {
            showLoading("Menghubungkan ke OneDrive & mengambil draf risalah...");

            try {
                const response = await fetch(READ_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: FILE_PATH })
                });

                if (!response.ok) throw new Error(`HTTP Status ${response.status}: Gagal membaca berkas.`);

                const data = await response.json();
                const htmlContent = data.htmlContent || data.body || '';

                if (!htmlContent) throw new Error("Berkas di OneDrive kosong.");

                initTinyMCE(htmlContent);
                hideLoading();

            } catch (err) {
                hideLoading();
                showErrorModal("Gagal memuat draf notulensi dari OneDrive: " + err.message);
            }
        }

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: FILE_PATH,
                        htmlContent: fullHtmlDocument
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`(Status ${response.status}) ${errText}`);
                }

                const resData = await response.json().catch(() => ({}));
                hideLoading();

                sessionStorage.removeItem('subdit_wil2_master_cache');
                sessionStorage.removeItem('subdit_wil2_master_cache_time');

                const pdfLink = resData.linkPdf || resData.linkBerkas || '';
                showSuccessModal(pdfLink);

            } catch (err) {
                hideLoading();
                showErrorModal("Gagal menyimpan perubahan: " + err.message);
            }
        }

        // ── HELPER MODAL ──
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('modalLoading').style.display = 'block';
            document.getElementById('modalSuccess').style.display = 'none';
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('modalLoading').style.display = 'none';
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function showSuccessModal(pdfLink) {
            document.getElementById('modalLoading').style.display = 'none';
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('modalSuccess').style.display = 'block';

            const btnPdf = document.getElementById('btnLihatPdfFinal');
            if (pdfLink) {
                btnPdf.href = pdfLink;
                btnPdf.style.display = 'inline-block';
            } else {
                btnPdf.style.display = 'none';
            }

            document.getElementById('modalOverlay').classList.add('active');
        }

        function showErrorModal(errorMsg) {
            document.getElementById('modalLoading').style.display = 'none';
            document.getElementById('modalSuccess').style.display = 'none';
            document.getElementById('modalError').style.display = 'block';
            document.getElementById('errorDetailText').textContent = errorMsg;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function hideAllModals() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    </script>
    <script src="navbar.js"></script>
</body>

</html>
